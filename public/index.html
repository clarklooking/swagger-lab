<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swagger Lab</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    :root {
      --bg-primary: #f0f2f5;
      --bg-card: #ffffff;
      --bg-sidebar: #ffffff;
      --bg-input: #f7f8fa;
      --bg-hover: #f0f2ff;
      --text-primary: #1a1a2e;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --border-color: #e5e7eb;
      --border-light: #f0f0f0;
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 30px rgba(0,0,0,0.08);
      --accent: #6366f1;
      --accent-light: #eef2ff;
      --accent-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --code-bg: #f8f9fa;
      --code-text: #1e293b;
      --method-get: #3b82f6;
      --method-post: #10b981;
      --method-put: #f59e0b;
      --method-delete: #ef4444;
      --method-patch: #06b6d4;
      --method-head: #8b5cf6;
      --method-options: #0d5aa7;
    }

    .dark {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --bg-sidebar: #1e293b;
      --bg-input: #334155;
      --bg-hover: #1e3a5f;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-color: #334155;
      --border-light: #2a3a4e;
      --shadow: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
      --accent-light: #1e293b;
      --code-bg: #0f172a;
      --code-text: #e2e8f0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }
    #app { display: flex; flex-direction: column; height: 100vh; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 3px; }

    /* Header */
    .header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      box-shadow: var(--shadow);
      z-index: 10;
      transition: background 0.3s, border-color 0.3s;
    }
    .header .logo {
      font-weight: 800;
      font-size: 20px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .header .logo small { font-weight: 400; font-size: 14px; -webkit-text-fill-color: var(--text-muted); }
    .header .spacer { flex: 1; }
    .header .env-badge {
      background: var(--accent-light);
      border: 1px solid var(--border-color);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }
    .header .env-badge:hover { border-color: var(--accent); color: var(--accent); }

    .btn-icon {
      width: 36px; height: 36px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.2s;
    }
    .btn-icon:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

    /* Upload area (full page) */
    .upload-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    .upload-box {
      background: var(--bg-card);
      border: 3px dashed var(--border-color);
      border-radius: 20px;
      padding: 60px 80px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: var(--shadow-lg);
      max-width: 520px;
      width: 100%;
    }
    .upload-box:hover, .upload-box.dragover {
      border-color: var(--accent);
      background: var(--accent-light);
      transform: translateY(-2px);
      box-shadow: 0 20px 40px rgba(99,102,241,0.15);
    }
    .upload-box .icon { font-size: 64px; color: var(--accent); margin-bottom: 16px; }
    .upload-box h2 { font-size: 22px; margin-bottom: 8px; }
    .upload-box p { color: var(--text-secondary); font-size: 14px; line-height: 1.6; }
    .upload-box .formats {
      display: inline-flex;
      gap: 8px;
      margin-top: 12px;
    }
    .upload-box .formats span {
      background: var(--accent-light);
      color: var(--accent);
      padding: 2px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }
    .upload-box input[type="file"] { display: none; }

    /* Main dashboard layout */
    .main-layout {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Left sidebar - endpoints */
    .sidebar {
      width: 340px;
      flex-shrink: 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: background 0.3s, border-color 0.3s;
    }
    .sidebar-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-header input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .sidebar-header input:focus { border-color: var(--accent); }
    .sidebar-header .count-badge {
      background: var(--accent-light);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .sidebar-scroll { flex: 1; overflow-y: auto; padding: 8px 0; }

    .tag-group { margin-bottom: 4px; }
    .tag-label {
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tag-label:hover { color: var(--text-secondary); }
    .tag-label .arrow { font-size: 10px; transition: transform 0.2s; }
    .tag-label .arrow.open { transform: rotate(90deg); }
    .tag-label .tag-count {
      margin-left: auto;
      background: var(--bg-input);
      padding: 1px 8px;
      border-radius: 10px;
      font-size: 11px;
    }

    .ep-item {
      padding: 10px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.15s;
      border-left: 3px solid transparent;
    }
    .ep-item:hover { background: var(--bg-hover); }
    .ep-item.active {
      background: var(--accent-light);
      border-left-color: var(--accent);
    }

    .method-badge {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
      min-width: 54px;
      text-align: center;
      letter-spacing: 0.3px;
    }
    .method-GET { background: var(--method-get); }
    .method-POST { background: var(--method-post); }
    .method-PUT { background: var(--method-put); }
    .method-DELETE { background: var(--method-delete); }
    .method-PATCH { background: var(--method-patch); }
    .method-HEAD { background: var(--method-head); }
    .method-OPTIONS { background: var(--method-options); }

    .ep-info { flex: 1; overflow: hidden; }
    .ep-path {
      font-family: 'SF Mono', 'Monaco', 'Menlo', monospace;
      font-size: 13px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ep-summary {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    /* Right panel */
    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--text-muted);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state h3 { font-size: 18px; color: var(--text-secondary); margin-bottom: 6px; }

    /* Detail card */
    .detail-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--border-color);
      margin-bottom: 20px;
    }
    .detail-header .method-badge { font-size: 14px; padding: 6px 14px; min-width: 68px; }
    .detail-header .path {
      font-family: 'SF Mono', 'Monaco', monospace;
      font-size: 15px;
      font-weight: 600;
      word-break: break-all;
    }
    .detail-header .summary { color: var(--text-secondary); font-size: 14px; margin-left: auto; white-space: nowrap; }

    /* Form elements */
    .form-row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }
    .form-row label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      min-width: 80px;
    }
    .form-row input, .form-row select {
      flex: 1;
      padding: 9px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 13px;
      font-family: 'SF Mono', 'Monaco', monospace;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-row input:focus { border-color: var(--accent); }

    .section-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0 12px;
    }
    .section-divider .line { flex: 1; height: 1px; background: var(--border-color); }
    .section-divider .label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
      white-space: nowrap;
      letter-spacing: 0.3px;
    }

    .param-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
    .param-table th {
      padding: 8px 12px;
      text-align: left;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .param-table td { padding: 8px 12px; border-bottom: 1px solid var(--border-light); font-size: 13px; vertical-align: top; }
    .param-table input, .param-table textarea, .param-table select {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .param-table input:focus, .param-table textarea:focus { border-color: var(--accent); }

    .param-name { font-family: 'SF Mono', monospace; font-weight: 600; font-size: 12px; }
    .param-required { color: var(--danger); margin-left: 2px; }
    .param-type { color: var(--text-muted); font-size: 11px; }
    .param-desc { color: var(--text-muted); font-size: 12px; }

    .body-editor {
      width: 100%;
      min-height: 180px;
      padding: 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--code-bg);
      color: var(--code-text);
      font-family: 'SF Mono', 'Monaco', monospace;
      font-size: 13px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }
    .body-editor:focus { border-color: var(--accent); }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .toolbar .btn-sm {
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-card);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }
    .toolbar .btn-sm:hover { border-color: var(--accent); color: var(--accent); }

    .btn {
      padding: 10px 28px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary {
      background: var(--accent-gradient);
      color: white;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99,102,241,0.4); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

    /* Response */
    .response-card {
      margin-top: 24px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.3s;
    }
    .response-card.success { border-color: var(--success); }
    .response-card.error { border-color: var(--danger); }
    .response-card.client-error { border-color: var(--warning); }

    .response-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
      background: var(--bg-input);
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
    }
    .response-meta .status-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      color: white;
    }
    .response-meta .status-badge.s2xx { background: var(--success); }
    .response-meta .status-badge.s4xx { background: var(--warning); }
    .response-meta .status-badge.s5xx { background: var(--danger); }
    .response-meta .status-badge.error { background: var(--danger); }

    .response-meta .stat {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .response-meta .stat strong { color: var(--text-primary); }

    .response-headers {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      max-height: 160px;
      overflow-y: auto;
    }
    .response-headers .hdr {
      font-size: 12px;
      font-family: 'SF Mono', monospace;
      color: var(--text-muted);
      padding: 2px 0;
    }
    .response-headers .hdr span { color: var(--text-secondary); }

    .response-body {
      padding: 16px;
      background: var(--code-bg);
      color: var(--code-text);
      font-family: 'SF Mono', 'Monaco', monospace;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 500px;
      overflow: auto;
    }

    /* Code snippets */
    .snippet-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
    }
    .snippet-tabs .tab {
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .snippet-tabs .tab:hover { color: var(--text-secondary); }
    .snippet-tabs .tab.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .snippet-box {
      background: var(--code-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      font-family: 'SF Mono', 'Monaco', monospace;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--code-text);
      position: relative;
    }
    .snippet-box .copy-btn {
      position: absolute;
      top: 8px; right: 8px;
      padding: 4px 10px;
      font-size: 11px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .snippet-box .copy-btn:hover { color: var(--accent); border-color: var(--accent); }

    /* History panel */
    .history-slide {
      width: 320px;
      background: var(--bg-card);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: all 0.3s;
      flex-shrink: 0;
    }
    .history-slide.collapsed { width: 0; border: none; overflow: hidden; padding: 0; }
    .history-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
    }
    .history-header .clear-btn {
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 400;
    }
    .history-header .clear-btn:hover { color: var(--danger); }
    .history-scroll { flex: 1; overflow-y: auto; padding: 8px; }
    .history-item {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
      font-size: 12px;
    }
    .history-item:hover { background: var(--bg-hover); }
    .history-item .h-method { font-weight: 700; flex-shrink: 0; min-width: 36px; }
    .history-item .h-status {
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }
    .history-item .h-status.ok { background: var(--success); }
    .history-item .h-status.fail { background: var(--danger); }
    .history-item .h-status.warn { background: var(--warning); }
    .history-item .h-path {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-muted);
      font-family: monospace;
      font-size: 11px;
    }
    .history-item .h-time { color: var(--text-muted); font-size: 11px; flex-shrink: 0; }

    /* Environment modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .modal {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 24px;
      width: 480px;
      max-width: 90vw;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
    }
    .modal h3 { margin-bottom: 16px; }
    .modal .env-item {
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .modal .env-item:hover { border-color: var(--accent); }
    .modal .env-item.active {
      border-color: var(--accent);
      background: var(--accent-light);
    }
    .modal .env-item .env-name { font-weight: 600; font-size: 14px; }
    .modal .env-item .env-url { font-size: 12px; color: var(--text-muted); font-family: monospace; }
    .modal .env-item .check { margin-left: auto; color: var(--accent); font-weight: 700; }
    .modal .form-group { margin-bottom: 12px; }
    .modal .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }
    .modal .form-group input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
    }
    .modal .form-group input:focus { border-color: var(--accent); }
    .modal .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .modal .modal-actions .btn { flex: 1; justify-content: center; }
    .btn-secondary {
      background: var(--bg-input);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }
    .btn-secondary:hover { border-color: var(--accent); }
    .btn-danger {
      background: var(--danger);
      color: white;
    }
    .btn-danger:hover { opacity: 0.9; }

    /* Misc */
    .auth-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
    }
    .auth-row label { font-size: 13px; font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
    .auth-row input {
      flex: 1;
      padding: 9px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 13px;
      font-family: monospace;
      outline: none;
    }
    .auth-row input:focus { border-color: var(--accent); }

    /* Info bar */
    .info-bar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .info-bar .api-title { font-weight: 700; font-size: 14px; }
    .info-bar .api-version {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-input);
      padding: 2px 8px;
      border-radius: 4px;
    }
    .info-bar .api-count { color: var(--text-muted); font-size: 13px; }
    .info-bar .spacer { flex: 1; }
    .info-bar .reset-btn {
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .info-bar .reset-btn:hover { color: var(--danger); background: rgba(239,68,68,0.1); }
  </style>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <div class="header">
      <div class="logo">Swagger Lab <small>| API Playground</small></div>
      <div class="spacer"></div>
      <div v-if="swaggerData" class="env-badge" @click="showEnvModal = true">
        {{ currentEnv.name }} ▾
      </div>
      <button class="btn-icon" @click="showHistory = !showHistory" title="请求历史">
        &#x1F4CB;
      </button>
      <button class="btn-icon" @click="toggleTheme" title="切换主题">
        {{ isDark ? '&#x2600;' : '&#x1F319;' }}
      </button>
    </div>

    <!-- Upload page -->
    <div v-if="!swaggerData" class="upload-page">
      <div class="upload-box" :class="{ dragover }"
           @click="$refs.fileInput.click()"
           @dragover.prevent="dragover = true"
           @dragleave="dragover = false"
           @drop.prevent="onDrop">
        <div class="icon">&#x1F4C4;</div>
        <h2>Upload Swagger File</h2>
        <p>Drag & drop your Swagger / OpenAPI file here, or click to browse</p>
        <div class="formats">
          <span>JSON</span>
          <span>YAML</span>
          <span>Swagger 2.0</span>
          <span>OpenAPI 3.0</span>
        </div>
        <input type="file" ref="fileInput" accept=".json,.yaml,.yml" @change="onFileSelect">
      </div>
    </div>

    <!-- Dashboard -->
    <template v-else>
      <div class="info-bar">
        <span class="api-title">{{ swaggerData.info.title || 'Untitled API' }}</span>
        <span class="api-version" v-if="swaggerData.info.version">v{{ swaggerData.info.version }}</span>
        <span class="api-count">{{ filteredEndpoints.length }} / {{ endpoints.length }} endpoints</span>
        <span class="spacer"></span>
        <span class="reset-btn" @click="reset">&#x2716; Close</span>
      </div>

      <div class="main-layout">
        <!-- Sidebar -->
        <div class="sidebar">
          <div class="sidebar-header">
            <input v-model="searchQuery" placeholder="Search endpoints..." @input="onSearch">
            <span class="count-badge">{{ filteredEndpoints.length }}</span>
          </div>
          <div class="sidebar-scroll">
            <div class="tag-group" v-for="(eps, tag) in groupedEndpoints" :key="tag">
              <div class="tag-label" @click="toggleTag(tag)">
                <span class="arrow" :class="{ open: !collapsedTags[tag] }">&#x25B6;</span>
                {{ tag }}
                <span class="tag-count">{{ eps.length }}</span>
              </div>
              <div v-show="!collapsedTags[tag]">
                <div class="ep-item" v-for="(ep, i) in eps" :key="i"
                     :class="{ active: selectedEndpoint === ep }"
                     @click="selectEndpoint(ep)">
                  <span class="method-badge" :class="'method-' + ep.method">{{ ep.method }}</span>
                  <div class="ep-info">
                    <div class="ep-path">{{ ep.path }}</div>
                    <div class="ep-summary" v-if="ep.summary">{{ ep.summary }}</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Panel -->
        <div class="panel">
          <div class="panel-scroll">
            <template v-if="selectedEndpoint">
              <div class="detail-header">
                <span class="method-badge" :class="'method-' + selectedEndpoint.method">{{ selectedEndpoint.method }}</span>
                <span class="path">{{ selectedEndpoint.path }}</span>
                <span class="summary" v-if="selectedEndpoint.summary">{{ selectedEndpoint.summary }}</span>
              </div>

              <!-- Auth + URL -->
              <div class="auth-row">
                <label>Target</label>
                <input v-model="currentEnv.url" placeholder="http://localhost:8080">
              </div>
              <div class="auth-row">
                <label>Token</label>
                <input v-model="currentEnv.token" placeholder="Bearer Token (optional)">
              </div>

              <!-- Path Params -->
              <template v-if="pathParams.length">
                <div class="section-divider"><span class="label">PATH PARAMETERS</span><span class="line"></span></div>
                <table class="param-table">
                  <tr><th>Name</th><th>Type</th><th>Description</th><th>Value</th></tr>
                  <tr v-for="p in pathParams" :key="p.name">
                    <td><span class="param-name">{{ p.name }}<span v-if="p.required" class="param-required">*</span></span></td>
                    <td><span class="param-type">{{ p.type || p.schema?.type || '-' }}</span></td>
                    <td><span class="param-desc">{{ p.description || '' }}</span></td>
                    <td><input v-model="paramValues[p.name]" :placeholder="p.required ? 'required' : 'optional'"></td>
                  </tr>
                </table>
              </template>

              <!-- Query Params -->
              <template v-if="queryParams.length">
                <div class="section-divider"><span class="label">QUERY PARAMETERS</span><span class="line"></span></div>
                <table class="param-table">
                  <tr><th>Name</th><th>Type</th><th>Description</th><th>Value</th></tr>
                  <tr v-for="p in queryParams" :key="p.name">
                    <td><span class="param-name">{{ p.name }}<span v-if="p.required" class="param-required">*</span></span></td>
                    <td><span class="param-type">{{ p.type || p.schema?.type || '-' }}</span></td>
                    <td><span class="param-desc">{{ p.description || '' }}</span></td>
                    <td><input v-model="paramValues[p.name]" :placeholder="p.required ? 'required' : 'optional'"></td>
                  </tr>
                </table>
              </template>

              <!-- Header Params -->
              <template v-if="headerParams.length">
                <div class="section-divider"><span class="label">HEADER PARAMETERS</span><span class="line"></span></div>
                <table class="param-table">
                  <tr><th>Name</th><th>Description</th><th>Value</th></tr>
                  <tr v-for="p in headerParams" :key="p.name">
                    <td><span class="param-name">{{ p.name }}<span v-if="p.required" class="param-required">*</span></span></td>
                    <td><span class="param-desc">{{ p.description || '' }}</span></td>
                    <td><input v-model="paramValues['_h_' + p.name]" :placeholder="p.required ? 'required' : 'optional'"></td>
                  </tr>
                </table>
              </template>

              <!-- Request Body -->
              <template v-if="hasBody">
                <div class="section-divider"><span class="label">REQUEST BODY</span><span class="line"></span></div>
                <div class="toolbar">
                  <span class="btn-sm" @click="beautifyBody">Beautify &#x21B1;</span>
                  <span class="btn-sm" @click="clearBody">Clear</span>
                </div>
                <textarea class="body-editor" v-model="requestBody" placeholder='{\n  "key": "value"\n}'></textarea>
              </template>

              <!-- Send -->
              <div style="margin-top: 20px;">
                <button class="btn btn-primary" :disabled="loading" @click="sendRequest">
                  {{ loading ? 'Sending...' : 'Send Request' }}
                </button>
              </div>

              <!-- Code Snippets -->
              <div style="margin-top: 24px;" v-if="lastSentRequest">
                <div class="section-divider"><span class="label">CODE SNIPPETS</span><span class="line"></span></div>
                <div class="snippet-tabs">
                  <span class="tab" :class="{ active: snippetLang === 'curl' }" @click="snippetLang = 'curl'">cURL</span>
                  <span class="tab" :class="{ active: snippetLang === 'fetch' }" @click="snippetLang = 'fetch'">Fetch</span>
                  <span class="tab" :class="{ active: snippetLang === 'axios' }" @click="snippetLang = 'axios'">Axios</span>
                  <span class="tab" :class="{ active: snippetLang === 'python' }" @click="snippetLang = 'python'">Python</span>
                </div>
                <div class="snippet-box">
                  <span class="copy-btn" @click="copySnippet">Copy</span>
                  <code>{{ currentSnippet }}</code>
                </div>
              </div>

              <!-- Response -->
              <div v-if="response" class="response-card" :class="responseCardClass">
                <div class="response-meta">
                  <span class="status-badge" :class="statusBadgeClass">{{ response.status }} {{ response.statusText }}</span>
                  <span class="stat">Time: <strong>{{ response.meta.time }}ms</strong></span>
                  <span class="stat">Size: <strong>{{ response.meta.sizeFormatted }}</strong></span>
                  <span class="stat">Time: <strong>{{ formatTime(response.meta.timestamp) }}</strong></span>
                </div>
                <div class="response-headers" v-if="response.headers && Object.keys(response.headers).length > 0">
                  <div class="hdr" v-for="(v, k) in response.headers" :key="k"><span>{{ k }}:</span> {{ v }}</div>
                </div>
                <div class="response-body">{{ formatResponse(response.data) }}</div>
              </div>
            </template>

            <div v-else class="empty-state">
              <div>
                <div class="icon">&#x2190;</div>
                <h3>Select an endpoint</h3>
                <p>Choose an API endpoint from the sidebar to start testing</p>
              </div>
            </div>
          </div>
        </div>

        <!-- History Sidebar -->
        <div class="history-slide" :class="{ collapsed: !showHistory }">
          <div class="history-header">
            History
            <span class="clear-btn" @click="clearHistory">Clear all</span>
          </div>
          <div class="history-scroll">
            <div class="history-item" v-for="h in requestHistory" :key="h.id">
              <span class="h-method" :class="'method-' + h.method">{{ h.method }}</span>
              <span class="h-status" :class="statusClass(h.status)">{{ h.status }}</span>
              <span class="h-path">{{ extractPath(h.url) }}</span>
              <span class="h-time">{{ h.time }}ms</span>
            </div>
            <div v-if="requestHistory.length === 0" style="text-align:center;color:var(--text-muted);padding:40px 0;font-size:13px;">
              No requests yet
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- Environment Modal -->
    <div class="modal-overlay" v-if="showEnvModal" @click.self="showEnvModal = false">
      <div class="modal">
        <h3>Environments</h3>
        <div class="env-item" v-for="(env, i) in environments" :key="i"
             :class="{ active: i === activeEnvIndex }"
             @click="switchEnv(i)">
          <div>
            <div class="env-name">{{ env.name }}</div>
            <div class="env-url">{{ env.url || 'no base URL' }}</div>
          </div>
          <div class="check" v-if="i === activeEnvIndex">&#x2713;</div>
        </div>

        <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border-color);">
          <h3>Edit Environment</h3>
          <div class="form-group">
            <label>Name</label>
            <input v-model="editEnv.name" placeholder="e.g. Production">
          </div>
          <div class="form-group">
            <label>Base URL</label>
            <input v-model="editEnv.url" placeholder="https://api.example.com">
          </div>
          <div class="form-group">
            <label>Bearer Token</label>
            <input v-model="editEnv.token" placeholder="(optional)">
          </div>
          <div class="modal-actions">
            <button class="btn btn-primary" @click="saveEnv">Save</button>
            <button class="btn btn-secondary" @click="addNewEnv">+ New</button>
            <button class="btn btn-danger" @click="deleteEnv">Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, computed, reactive, watch, nextTick } = Vue;

    const DEFAULT_ENVS = [
      { name: 'Production', url: '', token: '' },
      { name: 'Staging', url: '', token: '' },
      { name: 'Local', url: 'http://localhost:3210', token: '' }
    ];

    createApp({
      setup() {
        const dragover = ref(false);
        const swaggerData = ref(null);
        const endpoints = ref([]);
        const selectedEndpoint = ref(null);
        const paramValues = reactive({});
        const requestBody = ref('');
        const loading = ref(false);
        const response = ref(null);
        const lastSentRequest = ref(null);
        const searchQuery = ref('');
        const collapsedTags = reactive({});
        const snippetLang = ref('curl');
        const showHistory = ref(false);
        const showEnvModal = ref(false);
        const requestHistory = ref([]);
        const isDark = ref(false);
        const activeEnvIndex = ref(0);
        const environments = ref(JSON.parse(JSON.stringify(DEFAULT_ENVS)));
        const editEnv = reactive({ name: '', url: '', token: '' });

        // Current env proxy
        const currentEnv = computed({
          get: () => environments.value[activeEnvIndex.value] || environments.value[0],
          set: (val) => { environments.value[activeEnvIndex.value] = val; }
        });

        // Theme
        function toggleTheme() {
          isDark.value = !isDark.value;
          document.documentElement.classList.toggle('dark', isDark.value);
          localStorage.setItem('swagger-lab-theme', isDark.value ? 'dark' : 'light');
        }
        if (localStorage.getItem('swagger-lab-theme') === 'dark') {
          isDark.value = true;
          document.documentElement.classList.add('dark');
        }

        // Load envs from localStorage
        try {
          const saved = localStorage.getItem('swagger-lab-envs');
          if (saved) environments.value = JSON.parse(saved);
          const idx = parseInt(localStorage.getItem('swagger-lab-env-idx') || '0');
          if (idx < environments.value.length) activeEnvIndex.value = idx;
        } catch {}
        function saveEnvs() {
          localStorage.setItem('swagger-lab-envs', JSON.stringify(environments.value));
          localStorage.setItem('swagger-lab-env-idx', activeEnvIndex.value);
        }

        // Search
        function onSearch() {}

        const filteredEndpoints = computed(() => {
          if (!searchQuery.value) return endpoints.value;
          const q = searchQuery.value.toLowerCase();
          return endpoints.value.filter(ep =>
            ep.path.toLowerCase().includes(q) ||
            ep.summary.toLowerCase().includes(q) ||
            ep.method.toLowerCase().includes(q) ||
            ep.tag.toLowerCase().includes(q)
          );
        });

        const groupedEndpoints = computed(() => {
          const groups = {};
          for (const ep of filteredEndpoints.value) {
            const tag = ep.tag || 'default';
            if (!groups[tag]) groups[tag] = [];
            groups[tag].push(ep);
          }
          return groups;
        });

        // Param filters
        function filterParams(in_) {
          if (!selectedEndpoint.value) return [];
          return (selectedEndpoint.value.parameters || []).filter(p => p.in === in_);
        }
        const pathParams = computed(() => filterParams('path'));
        const queryParams = computed(() => filterParams('query'));
        const headerParams = computed(() => filterParams('header'));

        const hasBody = computed(() => {
          if (!selectedEndpoint.value) return false;
          const m = selectedEndpoint.value.method;
          return ['POST', 'PUT', 'PATCH'].includes(m) || !!selectedEndpoint.value.requestBody;
        });

        // Response
        const responseCardClass = computed(() => {
          if (!response.value) return '';
          if (!response.value.success) return 'error';
          const s = response.value.status;
          if (s >= 200 && s < 300) return 'success';
          if (s >= 400 && s < 500) return 'client-error';
          if (s >= 500) return 'error';
          return '';
        });
        const statusBadgeClass = computed(() => {
          if (!response.value) return '';
          if (!response.value.success) return 'error';
          const s = response.value.status;
          if (s >= 200 && s < 300) return 's2xx';
          if (s >= 400 && s < 500) return 's4xx';
          return 's5xx';
        });

        // Upload
        async function uploadFile(file) {
          const formData = new FormData();
          formData.append('file', file);
          try {
            const res = await fetch('/api/upload', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.error) { alert(data.error); return; }
            swaggerData.value = data;
            endpoints.value = data.endpoints;
            if (data.baseUrl && !currentEnv.value.url) {
              currentEnv.value.url = data.baseUrl;
            }
            // Auto open first tag
            nextTick(() => {
              for (const tag of Object.keys(groupedEndpoints.value)) {
                collapsedTags[tag] = false;
              }
            });
          } catch (err) { alert('Upload failed: ' + err.message); }
        }

        function onFileSelect(e) {
          const file = e.target.files[0];
          if (file) uploadFile(file);
        }
        function onDrop(e) {
          dragover.value = false;
          const file = e.dataTransfer.files[0];
          if (file) uploadFile(file);
        }

        // Select endpoint
        function selectEndpoint(ep) {
          selectedEndpoint.value = ep;
          response.value = null;
          lastSentRequest.value = null;
          Object.keys(paramValues).forEach(k => delete paramValues[k]);
          requestBody.value = '';

          if (ep.requestBody) {
            const content = ep.requestBody.content;
            if (content && content['application/json'] && content['application/json'].schema) {
              requestBody.value = JSON.stringify(generateExample(content['application/json'].schema), null, 2);
            }
            return;
          }
          // Try body param from swagger 2.0
          const bodyParam = (ep.parameters || []).find(p => p.in === 'body');
          if (bodyParam && bodyParam.schema) {
            requestBody.value = JSON.stringify(generateExample(bodyParam.schema), null, 2);
          }
        }

        function generateExample(schema) {
          if (!schema) return {};
          if (schema.example !== undefined) return schema.example;
          if (schema.default !== undefined) return schema.default;
          if (schema.type === 'object' || schema.properties) {
            const obj = {};
            for (const [key, prop] of Object.entries(schema.properties || {})) {
              if (prop.example !== undefined) obj[key] = prop.example;
              else obj[key] = generateExample(prop);
            }
            return obj;
          }
          if (schema.type === 'array') return [generateExample(schema.items || {})];
          if (schema.type === 'string') return '';
          if (schema.type === 'integer' || schema.type === 'number') return 0;
          if (schema.type === 'boolean') return false;
          return null;
        }

        // Body editor helpers
        function beautifyBody() {
          try {
            requestBody.value = JSON.stringify(JSON.parse(requestBody.value), null, 2);
          } catch {}
        }
        function clearBody() { requestBody.value = ''; }

        // Send request
        async function sendRequest() {
          if (!selectedEndpoint.value) return;
          if (!currentEnv.value.url) { alert('Please set the target URL'); return; }

          loading.value = true;
          response.value = null;

          const ep = selectedEndpoint.value;
          let url = currentEnv.value.url.replace(/\/$/, '') + ep.path;

          for (const p of pathParams.value) {
            const val = paramValues[p.name] || '';
            url = url.replace('{' + p.name + '}', encodeURIComponent(val));
          }
          // Also handle {petId} style
          for (const key of Object.keys(paramValues)) {
            url = url.replace('{' + key + '}', encodeURIComponent(paramValues[key] || ''));
          }

          const searchParams = new URLSearchParams();
          for (const p of queryParams.value) {
            const val = paramValues[p.name];
            if (val !== undefined && val !== '') searchParams.append(p.name, val);
          }
          const qs = searchParams.toString();
          if (qs) url += '?' + qs;

          const headers = {};
          if (currentEnv.value.token) {
            headers['Authorization'] = currentEnv.value.token.startsWith('Bearer ') ? currentEnv.value.token : 'Bearer ' + currentEnv.value.token;
          }
          for (const p of headerParams.value) {
            const val = paramValues['_h_' + p.name];
            if (val) headers[p.name] = val;
          }

          let body = null;
          if (hasBody.value && requestBody.value.trim()) {
            try { body = JSON.parse(requestBody.value); }
            catch { body = requestBody.value; }
          }

          try {
            const res = await fetch('/api/proxy', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ method: ep.method, url, headers, body })
            });
            const data = await res.json();
            response.value = data;
          } catch (err) {
            response.value = {
              success: false, status: 0, statusText: 'Network Error', data: err.message,
              meta: { time: 0, size: 0, sizeFormatted: '0 B', timestamp: new Date().toISOString() }
            };
          }
          lastSentRequest.value = { method: ep.method, url, headers, body };
          loading.value = false;
        }

        // Code snippets
        const currentSnippet = computed(() => {
          const req = lastSentRequest.value;
          if (!req) return '';
          const url = req.url;
          const headers = req.headers || {};
          const body = req.body;

          switch (snippetLang.value) {
            case 'curl': {
              let c = `curl -X ${req.method} '${url}'`;
              for (const [k, v] of Object.entries(headers)) {
                if (k.toLowerCase() !== 'content-type' || body) c += ` \\\n  -H '${k}: ${v}'`;
              }
              if (body) {
                const bStr = typeof body === 'string' ? body : JSON.stringify(body);
                c += ` \\\n  -H 'Content-Type: application/json' \\\n  -d '${bStr}'`;
              }
              return c;
            }
            case 'fetch': {
              let f = `fetch('${url}', {\n  method: '${req.method}',`;
              if (Object.keys(headers).length || body) {
                f += `\n  headers: {`;
                for (const [k, v] of Object.entries(headers)) f += `\n    '${k}': '${v}',`;
                f += `\n  }`;
              }
              if (body) {
                const bStr = typeof body === 'string' ? body : JSON.stringify(body);
                f += `,\n  body: JSON.stringify(${bStr})`;
              }
              f += `\n})`;
              return f;
            }
            case 'axios': {
              let a = `axios({\n  method: '${req.method.toLowerCase()}',\n  url: '${url}',`;
              if (Object.keys(headers).length) {
                a += `\n  headers: {`;
                for (const [k, v] of Object.entries(headers)) a += `\n    '${k}': '${v}',`;
                a += `\n  }`;
              }
              if (body) {
                const bStr = typeof body === 'string' ? body : JSON.stringify(body);
                a += `,\n  data: ${bStr}`;
              }
              a += `\n})`;
              return a;
            }
            case 'python': {
              let p = `import requests\n\n`;
              p += `url = '${url}'\n`;
              if (Object.keys(headers).length) {
                p += `headers = {\n`;
                for (const [k, v] of Object.entries(headers)) p += `    '${k}': '${v}',\n`;
                p += `}\n`;
              }
              if (body) {
                const bStr = typeof body === 'string' ? body : JSON.stringify(body);
                p += `data = ${bStr}\n`;
                p += `\nresponse = requests.${req.method.toLowerCase()}(url, headers=headers, json=data)`;
              } else {
                p += `\nresponse = requests.${req.method.toLowerCase()}(url, headers=headers)`;
              }
              p += `\nprint(response.json())`;
              return p;
            }
          }
          return '';
        });

        async function copySnippet() {
          try {
            await navigator.clipboard.writeText(currentSnippet.value);
          } catch {}
        }

        // History
        async function fetchHistory() {
          try {
            const res = await fetch('/api/history');
            const data = await res.json();
            requestHistory.value = data.data || [];
          } catch {}
        }

        async function clearHistory() {
          await fetch('/api/history', { method: 'DELETE' });
          requestHistory.value = [];
        }
        watch(() => response.value, () => { if (response.value) fetchHistory(); });
        fetchHistory();

        function statusClass(s) {
          if (s >= 200 && s < 300) return 'ok';
          if (s >= 400 && s < 500) return 'warn';
          return 'fail';
        }
        function extractPath(url) {
          try { return '/' + url.split('/').slice(3).join('/'); } catch { return url; }
        }

        // Toggle tags
        function toggleTag(tag) {
          collapsedTags[tag] = !collapsedTags[tag];
        }

        // Format
        function formatResponse(data) {
          if (data === undefined || data === null) return '';
          if (typeof data === 'string') return data;
          try { return JSON.stringify(data, null, 2); }
          catch { return String(data); }
        }
        function formatTime(ts) {
          if (!ts) return '';
          try { return new Date(ts).toLocaleTimeString(); } catch { return ''; }
        }

        // Reset
        function reset() {
          swaggerData.value = null;
          endpoints.value = [];
          selectedEndpoint.value = null;
          response.value = null;
          lastSentRequest.value = null;
          searchQuery.value = '';
          Object.keys(paramValues).forEach(k => delete paramValues[k]);
        }

        // Environment
        function switchEnv(i) {
          activeEnvIndex.value = i;
          showEnvModal.value = false;
          saveEnvs();
        }
        function saveEnv() {
          const idx = activeEnvIndex.value;
          environments.value[idx] = { ...environments.value[idx], ...editEnv };
          saveEnvs();
        }
        function addNewEnv() {
          environments.value.push({ name: 'New Env', url: '', token: '' });
          activeEnvIndex.value = environments.value.length - 1;
          editEnv.name = 'New Env';
          editEnv.url = '';
          editEnv.token = '';
        }
        function deleteEnv() {
          if (environments.value.length <= 1) return;
          environments.value.splice(activeEnvIndex.value, 1);
          if (activeEnvIndex.value >= environments.value.length) activeEnvIndex.value = environments.value.length - 1;
          saveEnvs();
        }
        watch(showEnvModal, (v) => {
          if (v) {
            const env = environments.value[activeEnvIndex.value];
            editEnv.name = env.name;
            editEnv.url = env.url;
            editEnv.token = env.token;
          }
        });

        return {
          dragover, swaggerData, endpoints, selectedEndpoint, paramValues,
          requestBody, loading, response, lastSentRequest, searchQuery,
          collapsedTags, snippetLang, showHistory, showEnvModal,
          requestHistory, isDark, environments, activeEnvIndex, editEnv,
          currentEnv, filteredEndpoints, groupedEndpoints,
          pathParams, queryParams, headerParams, hasBody,
          currentSnippet, responseCardClass, statusBadgeClass,
          toggleTheme, onSearch, onFileSelect, onDrop, uploadFile,
          selectEndpoint, beautifyBody, clearBody, sendRequest,
          formatResponse, formatTime, toggleTag, reset,
          statusClass, extractPath, copySnippet,
          switchEnv, saveEnv, addNewEnv, deleteEnv,
          clearHistory, fetchHistory
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
